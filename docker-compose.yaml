services:
  nginx:
    container_name: nginx                   # nom du container
    image: nginx:1.30.4-alpine3.24          # image docker utilisé pour nginx
    ports:
      - "8080:80"                           # publication et redirection du port 8080 (local) vers le port 80 (docker)
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/  # volume pour la config nginx
      - ./wordpress:/var/www/html           # volume pour que nginx ait accès aux fichiers wordpress

  db:
    container_name: mariadb             # nom du container
    image: mariadb:12.3.3               # image docker utilisé pour mariadb
    ports:
      - "3306:3306"                     # publication et redirection du port 3306 (local) vers le port 3306 (docker)
    volumes:
      - ./mariadb/data:/var/lib/mysql   # volume pour stocker les données mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=root      # mot de passe root de mariadb
      - MARIADB_DATABASE=appdb          # nom de la db crée et utilisé par wordpress
      - MARIADB_USER=user               # utilisateur de la db sur l'app
      - MARIADB_PASSWORD=user           # son mot de passe
    
  wordpress:
    container_name: wordpress                 # nom du container
    image: wordpress:7.1.0-php8.3-fpm-alpine  # image docker utilisé pour wordpress
    depends_on:
      - db                                    # le container wordpress depend du container db pour demarrer
    environment:
      - WORDPRESS_DB_HOST=db:3306             # port utilisé pour acceder à la db
      - WORDPRESS_DB_USER=user                # utilisateur de la db sur l'app
      - WORDPRESS_DB_PASSWORD=user            # son mot de passe
      - WORDPRESS_DB_NAME=appdb               # nom de la db
    volumes:
      - ./wordpress:/var/www/html             # volume pour la persistance des fichiers de code wordpress (volume partagé avec ngnix)