server {
    
    listen 80;                          # écoute le port 80

    server_name www.my-wordpress.ch;    # url du site (pas encore utile)
    
    root /var/www/html;                 # chemin vers le dossier ou nginx va chercher les fichiers
    index index.php;                    # fichier par defaut si url finit par /
    client_max_body_size 64M;           # taille maximal des fichiers qu'un utilisateur peur envoyer a nginx

    # reçoit les url
    location / {
        try_files $uri $uri/ /index.php?$args; # cherche un fichier, sinon un dossier, sinon envoie index.php
    }

    # reçoit les url qui finissent par .php
    location ~ \.php$ {
        try_files $uri =404; # vérifie que le fichier .php existe
        fastcgi_pass wordpress:9000; # la ou les fichiers .php sont envoyé
        fastcgi_index index.php; # fichier a exécuter si l'url se finit par /
        include fastcgi_params; # charge un fichier de config depuis l'image nginx
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # transmet a php le chemin du fichier a exécuter
    }

    # reçoit les assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;        # garde les assets en cache pendant 30 jours
        access_log off;     # n'écrit pas de log pour ces fichiers
    }
}