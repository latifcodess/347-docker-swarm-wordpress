services:
  nginx:
    container_name: nginx
    image: nginx:1.30.4-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginxv/conf.d/:/etc/nginx/conf.d/
      - ./wordpressv:/var/www/html

  db:
    container_name: mariadb
    image: mariadb:12.3.3
    ports:
      - "3306:3306"
    volumes:
      - ./mariadbv/data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=appdb
      - MARIADB_USER=user
      - MARIADB_PASSWORD=user
    
  wordpress:
    container_name: wordpress
    image: wordpress:7.1.0-php8.3-fpm-alpine
    depends_on:
      - db
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=user
      - WORDPRESS_DB_PASSWORD=user
      - WORDPRESS_DB_NAME=appdb
    volumes:
      - ./wordpressv:/var/www/html