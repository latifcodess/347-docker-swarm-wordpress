services:
  nginx:
    image: nginx:1.30.4-alpine3.24          # image docker utilisé pour nginx
    ports:
      - "80:80"                           # publication et redirection du port 8080 (local) vers le port 80 (docker)
    volumes:
      - wp_volume:/var/www/html        # volume pour que nginx ait accès aux fichiers wordpress
    networks:
      - frontend                            # fais partie du reseau frontend
    deploy: 
      replicas: 2
      restart_policy:
        condition: on-failure
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

  db:
    image: mariadb:12.3.3               # image docker utilisé pour mariadb
    volumes:
      - db_volume:/var/lib/mysql        # volume pour stocker les données mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=root      # mot de passe root de mariadb
      - MARIADB_DATABASE=appdb          # nom de la db crée et utilisé par wordpress
      - MARIADB_USER=user               # utilisateur de la db sur l'app
      - MARIADB_PASSWORD=user           # son mot de passe
    networks:
      - backend                         # fais partie du réseau backend
    deploy: 
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    
  wordpress:
    image: wordpress:7.1.0-php8.3-fpm-alpine  # image docker utilisé pour wordpress
    depends_on:
      - db                                    # le container wordpress depend du container db pour demarrer
    environment:
      - WORDPRESS_DB_HOST=db:3306             # port utilisé pour acceder à la db
      - WORDPRESS_DB_USER=user                # utilisateur de la db sur l'app
      - WORDPRESS_DB_PASSWORD=user            # son mot de passe
      - WORDPRESS_DB_NAME=appdb               # nom de la db
    volumes:
      - wp_volume:/var/www/html               # volume pour la persistance des fichiers de code wordpress (volume partagé avec ngnix)
    networks:
      - backend                               # fais partie du réseau backend
      - frontend
    deploy: 
      replicas: 2
      restart_policy:
        condition: on-failure

networks:
  frontend: # déclaration du réseau frontend
  backend:  # déclaration du réseau backend

volumes:
  wp_volume:
    driver: local                       # emplacement du driver
    driver_opts:
      type: nfs                         # type du driver
      o: addr=172.26.1.5,rw,nfsvers=4   # ip du serveur nfs
      device: :/var/nfs_share/nfs02     # chemin du dossier nfs
  db_volume:  

configs:
  nginx_config:
    file: ./nginx/conf.d/default.conf